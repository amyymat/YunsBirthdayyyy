<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Surprise For You ✨</title>
  
  <!-- Google Fonts: Great Vibes (Kaligrafi), Playfair Display (Surat), Poppins (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Pautan ke Fail CSS Luaran -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Audio Latar Belakang (Boleh tukar src kepada 'lagu.mp3' dalam repo anda) -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- ==================== SKRIN 1: SAMPUL TERTUTUP ==================== -->
  <section id="screen-envelope" class="screen active">
    <h1 class="script-title">Press the Envelope</h1>
    
    <div class="envelope-wrapper" id="btnOpenEnvelope">
      <div class="envelope-closed">
        <div class="envelope-flap"></div>
        <div class="wax-seal">💌</div>
      </div>
    </div>

    <p class="tap-hint">tap to lanjut</p>
  </section>

  <!-- ==================== SKRIN 2: SAMPUL TERBUKA & KOLAJ ==================== -->
  <section id="screen-opened" class="screen">
    <div class="collage-stage">
      
      <!-- Gambar Kiri Atas (Bingkai Bulat Berpendar) -->
      <div class="collage-item photo-circle delay-1">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Kenangan 1">
      </div>

      <!-- Gambar Kiri Bawah (Polaroid Senget) -->
      <div class="collage-item photo-polaroid-left delay-2">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400" alt="Kenangan 2">
      </div>

      <!-- Hiasan Bunga & Rama-rama -->
      <span class="deco-floating deco-butterfly delay-2">🦋</span>
      <span class="deco-floating deco-rose delay-3">🌹</span>

      <!-- Sampul Terbuka di Tengah -->
      <div class="open-envelope-card">
        <div class="card-inner">
          <h2>Happy<br>Birthday</h2>
          <span class="card-date">( 17.11.2003 )</span>
        </div>
      </div>

      <!-- Strip Photobooth 3 Gambar di Sebelah Kanan -->
      <div class="collage-item photobooth-strip delay-3">
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300" alt="Strip 1">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300" alt="Strip 2">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=300" alt="Strip 3">
      </div>

    </div>

    <button class="btn-surprise" data-target="screen-menu">TAP FOR SURPRISE</button>
  </section>

  <!-- ==================== SKRIN 3: MENU UTAMA (4 IKON) ==================== -->
  <section id="screen-menu" class="screen">
    <h1 class="script-title">Choose the Surprise</h1>
    
    <div class="menu-grid">
      <!-- Ikon 1: Journey -->
      <div class="menu-card" data-target="screen-journey">
        <div class="lens-flare"></div>
        <div class="menu-icon">📷</div>
        <span class="menu-label">Journey</span>
      </div>

      <!-- Ikon 2: Moment -->
      <div class="menu-card" data-target="screen-moment">
        <div class="lens-flare"></div>
        <div class="menu-icon">⏱️</div>
        <span class="menu-label">Moment</span>
      </div>

      <!-- Ikon 3: Playlist -->
      <div class="menu-card" data-target="screen-playlist">
        <div class="lens-flare"></div>
        <div class="menu-icon">💿</div>
        <span class="menu-label">Playlist</span>
      </div>

      <!-- Ikon 4: Gift (Surat & Audio) -->
      <div class="menu-card" id="btnOpenGift">
        <div class="lens-flare"></div>
        <div class="menu-icon">🎁</div>
        <span class="menu-label">Gift</span>
      </div>
    </div>
  </section>

  <!-- ==================== SKRIN 4A: JOURNEY (KISAH PERJALANAN) ==================== -->
  <section id="screen-journey" class="screen">
    <button class="btn-back" data-target="screen-menu">BACK ◀</button>
    <h2 class="script-title section-subtitle">Our Journey</h2>
    
    <div class="journey-showcase">
      <div class="journey-card">
        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=500" alt="First Meet">
        <p class="journey-caption">Awal Pertemuan ✨</p>
      </div>
      <div class="journey-card">
        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500" alt="Best Trip">
        <p class="journey-caption">Momen Terindah 🌅</p>
      </div>
      <div class="journey-card">
        <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=500" alt="Together">
        <p class="journey-caption">Terus Bersama 🤍</p>
      </div>
    </div>
  </section>

  <!-- ==================== SKRIN 4B: MOMENT (GALERI POLAROID 7 GAMBAR) ==================== -->
  <section id="screen-moment" class="screen">
    <button class="btn-back" data-target="screen-menu">BACK ◀</button>
    
    <!-- Pelekat Hiasan seperti dalam video -->
    <span class="sticker sticker-top-left">🪐</span>
    <span class="sticker sticker-top-right">💖</span>
    <span class="sticker sticker-bottom-left">🐋</span>

    <div class="polaroid-wall">
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Moment 1"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300" alt="Moment 2"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300" alt="Moment 3"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300" alt="Moment 4"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=300" alt="Moment 5"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=300" alt="Moment 6"></div>
      <div class="polaroid"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300" alt="Moment 7"></div>
    </div>
  </section>

  <!-- ==================== SKRIN 5: GIFT (SURAT & PEMAIN PIRING HITAM) ==================== -->
  <section id="screen-gift" class="screen">
    <button class="btn-back" data-target="screen-menu">BACK ◀</button>
    
    <div class="gift-layout">
      <!-- Bahagian Kiri: Nama & Kertas Surat -->
      <div class="letter-column">
        <h2 class="recipient-name">Nurul Ayuni Cantik Saya</h2>
        <div class="crumpled-paper">
          <p id="typewriter-text"></p>
          <span class="typing-cursor">|</span>
        </div>
      </div>

      <!-- Bahagian Kanan: Bingkai Emas & Hiasan -->
      <div class="frame-column">
        <div class="gold-frame-main">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Potret Utama">
        </div>
        <span class="frame-deco-cam">📸</span>
        <span class="frame-deco-rose">🌹</span>
      </div>
    </div>

    <!-- Piring Hitam (Vinyl Player) di Bawah -->
    <div class="vinyl-wrapper" id="vinylControl">
      <div class="vinyl-disc" id="vinylDisc">
        <div class="vinyl-center"></div>
      </div>
      <div class="vinyl-ui">
        <div class="vinyl-pill">⏮ <span id="playIcon">▶</span> ⏭</div>
        <span class="vinyl-status" id="musicStatus">Play Musik</span>
      </div>
    </div>
  </section>

  <!-- ==================== SKRIN 6: PLAYLIST (YOUTUBE & 3 BINGKAI EMAS) ==================== -->
  <section id="screen-playlist" class="screen">
    <button class="btn-back" data-target="screen-menu">BACK ◀</button>
    
    <div class="playlist-layout">
      <!-- Pemain YouTube di Sebelah Kiri -->
      <div class="youtube-box">
        <div class="video-responsive">
          <iframe 
            id="ytPlayer"
            src="https://www.youtube.com/embed/gvunApwKIiY" 
            title="YouTube Music Player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="retro-decorations">
          <span>📻</span>
          <span>🎶</span>
          <span>📺</span>
        </div>
      </div>

      <!-- 3 Bingkai Gambar Emas di Sebelah Kanan -->
      <div class="trio-gold-frames">
        <div class="mini-gold-frame frame-1">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Foto 1">
        </div>
        <div class="mini-gold-frame frame-2">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300" alt="Foto 2">
        </div>
        <div class="mini-gold-frame frame-3">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300" alt="Foto 3">
        </div>
      </div>
    </div>
  </section>

  <!-- Pautan ke Fail JavaScript Luaran -->
  <script src="script.js"></script>
</body>
</html>
